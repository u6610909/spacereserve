# SpaceReserve — Nginx location block for the Class VM
# (azureuser@20.2.140.191, ratchanon-bad2026.eastasia.cloudapp.azure.com).
#
# This is NOT a full server block. It is meant to be pasted inside the
# existing SSL `server { ... }` block that already serves /content
# (WordPress) and /api (the CRUD lab), alongside those location blocks —
# never replacing them (project rule).
#
# Before pasting: `sudo nginx -T | less` to see the live config, and back it
# up (`sudo cp /etc/nginx/sites-enabled/<file> ~/nginx-backup-$(date +%s).conf`)
# per docs/architecture.md. Reuse the existing cert — never `certbot --force-renewal`
# and never request a new one (docs/architecture.md).
#
# After pasting:
#   sudo nginx -t
#   sudo systemctl reload nginx
#   curl -sI https://ratchanon-bad2026.eastasia.cloudapp.azure.com/content/ | head -1
#   curl -sI https://ratchanon-bad2026.eastasia.cloudapp.azure.com/api/     | head -1
#   curl -s  https://ratchanon-bad2026.eastasia.cloudapp.azure.com/spacereserve/api/v1/health
# All three must answer before the change is considered done.

location /spacereserve/ {
    proxy_pass         http://127.0.0.1:4000/spacereserve/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Accepted in docs/architecture.md — /spacereserve (no trailing slash) 404s
# without this, since Nginx only matches the prefix location on the slash.
location = /spacereserve {
    return 301 /spacereserve/;
}
