# SpaceReserve — full Nginx server config for the dedicated VM
# (azureuser@172.197.163.99, spacereserve.malaysiawest.cloudapp.azure.com).
#
# This VM only runs SpaceReserve — there's no other site to avoid breaking.
# `certbot --nginx` generates the 80→443 redirect and the ssl_certificate
# lines the first time it runs; this file documents the resulting location
# blocks so a rebuilt VM (or a teammate) can reproduce them exactly.
#
# After editing:
#   sudo nginx -t
#   sudo systemctl reload nginx
#   curl -s https://spacereserve.malaysiawest.cloudapp.azure.com/spacereserve/api/v1/health
#   curl -sI https://spacereserve.malaysiawest.cloudapp.azure.com/spacereserve/ | head -1

server {
    listen 80;
    listen [::]:80;
    server_name spacereserve.malaysiawest.cloudapp.azure.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name spacereserve.malaysiawest.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/spacereserve.malaysiawest.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spacereserve.malaysiawest.cloudapp.azure.com/privkey.pem;

    # Express owns the whole /spacereserve prefix, so no path is stripped here.
    location ^~ /spacereserve/api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 6m;
    }

    location ^~ /spacereserve/uploads/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else under /spacereserve/ is the built React app — SPA
    # fallback so client-side routes (e.g. /spacereserve/rooms/abc) don't 404.
    location /spacereserve/ {
        root /var/www;
        try_files $uri $uri/ /spacereserve/index.html;
    }

    # Nginx only matches the prefix location on the trailing slash.
    location = /spacereserve {
        return 301 /spacereserve/;
    }

    location = / {
        return 301 /spacereserve/;
    }
}
