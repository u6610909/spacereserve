# Production (Azure VM). NO build section — the VM is memory-starved and must
# never build images (CLAUDE.md hard rule 9). CI builds and pushes to GHCR;
# deploy.sh only pulls and restarts.
#
# Single service, no postgres (DECISIONS.md "THE BIG CHANGE"): the VM is a
# Standard B2ats v2 (1 GiB RAM) already running MySQL + WordPress + nginx +
# the lab API — a Postgres container did not fit. Production points at Azure
# Database for PostgreSQL Flexible Server instead; SpaceReserve-DatabaseUrl
# in Key Vault carries that connection string (?sslmode=require). Local dev
# still gets its own Postgres container — see docker-compose.yml.
#
# Override IMAGE with a specific tag (e.g. the commit SHA) to deploy or roll back:
#   IMAGE=ghcr.io/u6610909/spacereserve:<sha> docker compose -f docker-compose.prod.yml up -d
services:
  api:
    image: ${IMAGE:-ghcr.io/u6610909/spacereserve:latest}
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # The three service-principal credentials the app uses to authenticate
      # to Key Vault — the only *secrets* in the environment. Every other
      # secret, including the database URL, is fetched from the vault at boot.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      # The vault's address — not a secret (it's in the portal, discoverable),
      # so it rides in the env rather than forcing a code change + CI rebuild
      # every time the vault moves. keyvault.ts falls back to a build-time
      # constant if this is unset.
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL}
      # OIDC login config — NOT secrets (tenant id and the callback URL are
      # both public). The AD *client id/secret* still come from Key Vault
      # (SpaceReserve-AdClientId / -AdClientSecret). Leave these blank and the
      # app simply has no login provider wired (dev-login is prod-disabled, so
      # only /health and the peer API stay reachable).
      AD_TENANT_ID: ${AD_TENANT_ID:-}
      AD_REDIRECT_URI: ${AD_REDIRECT_URI:-}
      # Where /auth/callback sends the browser after setting the session
      # cookie. Blank -> callback returns the token as JSON instead (fine for
      # an API-only / Postman demo).
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Gemini API host override — not a secret. Azure East Asia (Hong Kong)
      # is region-blocked for the free Gemini API, so this points at a
      # pass-through proxy in a supported location. Blank -> SDK default host
      # (fine anywhere not on Google's blocklist).
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
    ports:
      # Bound to loopback only — Nginx on the host proxies to it. Never exposed
      # publicly; the Azure NSG and UFW keep 4000 closed from outside.
      - '127.0.0.1:4000:4000'
    volumes:
      # Named volume so room images survive `docker compose up` pulling a new
      # image tag — the container itself is thrown away on every deploy.
      - room-images:/app/uploads
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/spacereserve/api/v1/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  room-images:
